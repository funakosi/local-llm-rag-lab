[project]
name = "local-llm-rag-lab"
version = "0.1.0"
description = "ローカルLLMとRAGを使用した文書検索の実践"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Akira Funakoshi", email = "funakosi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "feedparser>=6.0.14",
    "ollama>=0.6.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "textual>=8.2.8",
]

[project.scripts]
news-collect = "local_llm_rag_lab.news_rag.collect_rss:main"
news-build-vecdb = "local_llm_rag_lab.news_rag.build_vector_db:main"
news-cui = "local_llm_rag_lab.news_rag.search_news:main"
news-tui = "local_llm_rag_lab.news_rag.search_news_tui:main"
webui-chat = "local_llm_rag_lab.webui_rag.chat:main"
webui-eval = "local_llm_rag_lab.webui_rag.evaluate:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
